sonar_preview:
  only:
    refs:
      - api
  stage: test
  script:
    - /home/gitlab-runner/ci/preview.sh $CI_PROJECT_ID $CI_COMMIT_SHA $CI_COMMIT_REF_NAME $CI_PIPELINE_ID
  tags:
    - ebatis2
    
sonar_analyze:
  only:
    refs:
      - api
  stage: test
  script:
    - /home/gitlab-runner/ci/analyze.sh $CI_PROJECT_NAME $CI_PROJECT_NAME
  tags:
    - ebatis2
    
sonar_preview_sec:
  only:
    refs:
      - triggers
    variables:
      - $CI_COMMIT_REF_NAME == "master"
  stage: test
  script:
    - /home/gitlab-runner/ci/preview-sec.sh $CI_PROJECT_ID $CI_COMMIT_SHA $CI_COMMIT_REF_NAME $CI_PIPELINE_ID
  tags:
    - ebatis2

sonar_analyze_sec:
  only:
    refs:
      - triggers
    variables:
      - $CI_COMMIT_REF_NAME == "master"
  stage: test
  script:
    - /home/gitlab-runner/ci/analyze-sec.sh $CI_PROJECT_NAME $CI_PROJECT_NAME
  tags:
    - ebatis2

sonar_preview:on-schedule:
  only:
    - schedules
  stage: test
  script:
    - /home/gitlab-runner/ci/preview-master.sh $CI_PROJECT_ID $CI_COMMIT_SHA $CI_COMMIT_REF_NAME
  tags:
    - ebatis2
    
sonar_analyze:on-schedule:
  only:
    - schedules
  stage: test
  script:
    - /home/gitlab-runner/ci/analyze-master.sh $CI_PROJECT_NAME $CI_PROJECT_NAME
  tags:
    - ebatis2

coverage_analyze:
  only:
    - triggers
  except:
    - master
  stage: test
  script:
    - /home/gitlab-runner/ci/coverage-analyze.sh $CI_PROJECT_NAME $CI_PROJECT_NAME $CI_COMMIT_REF_NAME $CI_PIPELINE_ID
  tags:
    - coverage_test
